name: Publish sample gallery
on:
  push:
    branches: [main]
    paths: ['examples/**', 'assets/templates/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public samples
        run: |
          mkdir -p _site
          cp -R examples _site/
          cp index.html .nojekyll _site/
          mkdir -p _site/examples/engineering-2d
          cp assets/templates/engineering-2d-v1/{demo.html,modules-demo.mp4,preview.mp4,poster.png} _site/examples/engineering-2d/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy gallery
        id: deployment
        uses: actions/deploy-pages@v4
